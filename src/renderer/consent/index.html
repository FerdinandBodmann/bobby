<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Bobby needs your ok</title>
    <link rel="stylesheet" href="consent.css" />
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <div class="avatar" id="avatar"></div>
        <div>
          <div class="kicker">Bobby wants to</div>
          <div class="summary" id="summary">do something</div>
        </div>
      </div>
      <div class="warn" id="warn">This changes something on your device.</div>
      <div class="actions">
        <button class="deny" id="btnDeny">Deny</button>
        <button class="ghost" id="btnAlways" hidden>Always allow</button>
        <button class="primary" id="btnOnce">Approve once</button>
      </div>
      <div class="foot">esc to deny</div>
    </div>
    <script src="consent.js"></script>
  </body>
</html>
