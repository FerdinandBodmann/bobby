<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
    <title>bobby</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div id="stage" data-mood="idle">
      <div class="dragger" id="dragger" title="drag me">
        <div class="stalk"></div>
        <div class="leaf"></div>
        <div class="leaf-shine"></div>
      </div>

      <div class="shadow" id="shadow"></div>

      <div class="ball" id="ball" title="bobby">
        <div class="gloss"></div>
        <div class="rim"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>

        <div class="eyes" id="eyes">
          <div class="eye"><i class="g1"></i><i class="g2"></i></div>
          <div class="eye"><i class="g1"></i><i class="g2"></i></div>
        </div>

        <div class="mouth" id="mouth"></div>

        <div class="sparkle">✦</div>
        <div class="sparkle two">✧</div>
        <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
      </div>
    </div>
    <script src="buddy.js"></script>
  </body>
</html>
