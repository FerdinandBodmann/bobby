<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
    <title>bobby</title>
    <link rel="stylesheet" href="buddy.css" />
  </head>
  <body>
    <div id="stage" data-mood="idle">
      <div class="shadow" id="shadow"></div>

      <div class="ball" id="ball" title="bobby">
        <svg class="bean" viewBox="0 0 57.81424 40.635151" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="beanFill" x1="0" y1="0" x2="0.15" y2="1">
              <stop offset="0" stop-color="var(--ball-light)" />
              <stop offset="0.5" stop-color="var(--ball-color)" />
              <stop offset="1" stop-color="var(--ball-dark)" />
            </linearGradient>
          </defs>
          <rect width="57.81424" height="40.635151" rx="23.786428" ry="15.861964" fill="url(#beanFill)" />
        </svg>

        <div class="blush left"></div>
        <div class="blush right"></div>

        <div class="eyes" id="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>

        <div class="mouth" id="mouth"></div>

        <div class="sparkle">✦</div>
        <div class="sparkle two">✧</div>
        <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
      </div>
    </div>
    <script src="buddy.js"></script>
  </body>
</html>
