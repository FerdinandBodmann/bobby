[workspace]
resolver = "2"
members = ["src-tauri", "hook"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bobby"]

[profile.release]
# LTO off on purpose: the Arch PKGBUILD comment in PROMPT.md says LTO makes
# the Rust build very slow, so day-to-day release builds skip it.
lto = false
codegen-units = 16
strip = "symbols"
